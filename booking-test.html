<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantage North | Ziina Payment Test</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vnBg: '#FAFAFA',
                        vnGray: '#646464',
                        vnDarkGray: '#2B2B2B',
                        vnBlack: '#000000',
                        vnWhite: '#FFFFFF',
                    },
                    fontFamily: {
                        urbanist: ['"Urbanist"', 'sans-serif'],
                        epilogue: ['"Epilogue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAFAFA;
            color: #000000;
            font-family: 'Epilogue', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 {
            font-family: 'Urbanist', sans-serif;
        }
    </style>
</head>
<body class="bg-vnBg text-vnBlack min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full border-b border-neutral-200 bg-white sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center">
                <img src="/logo/vantage_north_logo_light.png" alt="Vantage North" class="h-7 w-auto">
            </a>
            <a href="/book" class="text-sm font-medium text-vnGray hover:text-vnBlack transition">
                Back to full booking
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto px-4 sm:px-6 py-12 sm:py-16 space-y-6">
        <!-- Return Status Banner -->
        <div id="statusBanner" class="hidden rounded-2xl p-5 border text-sm"></div>

        <!-- Test Payment Card -->
        <section class="bg-white border border-neutral-200 rounded-3xl p-6 sm:p-8 shadow-[0_14px_40px_rgba(0,0,0,0.04)] space-y-6">
            <div>
                <span class="inline-block text-[11px] font-urbanist font-semibold uppercase tracking-wider px-2.5 py-1 rounded-full bg-neutral-100 text-vnGray mb-3">
                    Internal Payment Check
                </span>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Ziina checkout test</h1>
                <p class="text-sm text-vnDarkGray mt-1.5 leading-relaxed">
                    Run a small payment through Ziina without creating a calendar slot or inspection booking.
                </p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="amountInput" class="block text-xs uppercase tracking-wider text-vnGray font-medium mb-2">
                        Amount (AED)
                    </label>
                    <div class="flex items-center gap-2">
                        <button type="button" data-amt="2" class="amt-btn px-4 py-2 rounded-xl border border-black bg-black text-white text-sm font-urbanist font-semibold">2 AED</button>
                        <button type="button" data-amt="5" class="amt-btn px-4 py-2 rounded-xl border border-neutral-200 bg-white text-vnBlack text-sm font-urbanist font-semibold hover:border-black transition">5 AED</button>
                        <button type="button" data-amt="10" class="amt-btn px-4 py-2 rounded-xl border border-neutral-200 bg-white text-vnBlack text-sm font-urbanist font-semibold hover:border-black transition">10 AED</button>
                        <input
                            id="amountInput"
                            type="number"
                            min="2"
                            max="25"
                            value="2"
                            class="w-24 px-3 py-2 rounded-xl border border-neutral-300 text-sm font-urbanist font-bold text-center focus:outline-none focus:border-black"
                        >
                    </div>
                </div>

                <div class="rounded-2xl bg-neutral-50 border border-neutral-200 p-4 flex items-center justify-between">
                    <span class="text-sm text-vnDarkGray">Total due</span>
                    <span id="totalDisplay" class="text-2xl font-urbanist font-bold">2 AED</span>
                </div>

                <div id="errorBox" class="hidden rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm p-3.5"></div>

                <button
                    id="payBtn"
                    type="button"
                    class="w-full inline-flex items-center justify-center gap-2 bg-vnBlack text-vnWhite font-urbanist text-sm font-semibold uppercase tracking-wider px-6 py-4 rounded-2xl hover:bg-neutral-800 transition disabled:opacity-50"
                >
                    <span>Pay 2 AED with Ziina</span>
                    <span aria-hidden="true">→</span>
                </button>
            </div>
        </section>
    </main>

    <script>
        const amountInput = document.getElementById('amountInput');
        const totalDisplay = document.getElementById('totalDisplay');
        const payBtn = document.getElementById('payBtn');
        const errorBox = document.getElementById('errorBox');
        const statusBanner = document.getElementById('statusBanner');
        const amtBtns = document.querySelectorAll('.amt-btn');

        function setAmount(val) {
            const amt = Math.min(25, Math.max(2, Math.round(Number(val) || 2)));
            amountInput.value = String(amt);
            totalDisplay.textContent = `${amt} AED`;
            payBtn.querySelector('span').textContent = `Pay ${amt} AED with Ziina`;
            amtBtns.forEach(b => {
                const active = Number(b.dataset.amt) === amt;
                b.className = active
                    ? 'amt-btn px-4 py-2 rounded-xl border border-black bg-black text-white text-sm font-urbanist font-semibold'
                    : 'amt-btn px-4 py-2 rounded-xl border border-neutral-200 bg-white text-vnBlack text-sm font-urbanist font-semibold hover:border-black transition';
            });
        }

        amtBtns.forEach(b => b.addEventListener('click', () => setAmount(b.dataset.amt)));
        amountInput.addEventListener('input', () => setAmount(amountInput.value));

        payBtn.addEventListener('click', async () => {
            errorBox.classList.add('hidden');
            payBtn.disabled = true;
            const origText = payBtn.querySelector('span').textContent;
            payBtn.querySelector('span').textContent = 'Creating Ziina checkout...';

            try {
                const res = await fetch('/api/test-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amountAed: Number(amountInput.value) || 2 }),
                });
                const data = await res.json();
                if (!res.ok || !data.redirectUrl) {
                    throw new Error(data.error || 'Failed to start Ziina checkout');
                }
                window.location.href = data.redirectUrl;
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
                payBtn.disabled = false;
                payBtn.querySelector('span').textContent = origText;
            }
        });

        // Handle return from Ziina
        (async function checkReturnStatus() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const ref = params.get('ref');
            const intentId = params.get('intent_id');

            if (status === 'cancelled') {
                statusBanner.className = 'rounded-2xl p-5 border text-sm bg-amber-50 border-amber-200 text-amber-900';
                statusBanner.innerHTML = `<strong>Payment cancelled.</strong> Reference: <span class="font-mono">${ref || '—'}</span>`;
                statusBanner.classList.remove('hidden');
                return;
            }

            if (status === 'success') {
                statusBanner.className = 'rounded-2xl p-5 border text-sm bg-emerald-50 border-emerald-200 text-emerald-900';
                statusBanner.innerHTML = `<strong>Returned from Ziina!</strong> Verifying payment status...`;
                statusBanner.classList.remove('hidden');

                if (intentId && !intentId.includes('{')) {
                    try {
                        const res = await fetch(`/api/test-checkout?intent_id=${encodeURIComponent(intentId)}`);
                        const info = await res.json();
                        const aed = info.amount ? (info.amount / 100).toFixed(2) : '—';
                        statusBanner.innerHTML = `
                            <div class="font-semibold mb-1">Payment status: ${info.status || 'completed'}</div>
                            <div class="text-xs space-y-0.5">
                                <div>Reference: <span class="font-mono">${ref || '—'}</span></div>
                                <div>Amount: ${aed} ${info.currency_code || 'AED'} (${info.test ? 'Test Mode' : 'Live Mode'})</div>
                            </div>
                        `;
                    } catch (_) {
                        statusBanner.innerHTML = `<strong>Payment completed.</strong> Reference: <span class="font-mono">${ref || '—'}</span>`;
                    }
                } else {
                    statusBanner.innerHTML = `<strong>Payment completed.</strong> Reference: <span class="font-mono">${ref || '—'}</span>`;
                }
            }
        })();
    </script>
</body>
</html>
