<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantage North | Premium Handover &amp; Rectification Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Urbanist & Epilogue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vnBg: '#D5D5D5',
                        vnGray: '#646464',
                        vnBlack: '#000000',
                        vnWhite: '#FFFFFF',
                    },
                    fontFamily: {
                        urbanist: ['"Urbanist"', 'sans-serif'],
                        epilogue: ['"Epilogue"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #D5D5D5;
            color: #000000;
            font-family: 'Epilogue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Urbanist', sans-serif;
        }

        /* Subtle entrance animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 { animation-delay: 0.1s; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; opacity: 0; }
        .delay-300 { animation-delay: 0.3s; opacity: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-vnBg text-vnBlack selection:bg-vnBlack selection:text-vnWhite">

    <!-- Top Navigation / Logo Area -->
    <header class="w-full pt-12 pb-6 px-6 md:px-12 flex justify-center animate-fade-up">
        <a href="#" class="inline-block focus:outline-none">
            <img 
                src="logo/vantage_north_logo_light.png" 
                alt="Vantage North" 
                class="h-8 sm:h-10 md:h-12 w-auto object-contain"
            >
        </a>
    </header>

    <!-- Center Main Content -->
    <main class="flex-grow flex items-center justify-center px-6 md:px-12 py-12 md:py-16">
        <div class="w-full max-w-4xl mx-auto flex flex-col items-center text-center">
            
            <!-- Big Tagline -->
            <h1 class="font-urbanist text-4xl sm:text-5xl md:text-6xl lg:text-[4.25rem] font-semibold tracking-tight text-vnBlack leading-[1.08] max-w-3xl mb-6 animate-fade-up delay-100">
                Premium Handover &amp; Rectification Management
            </h1>

            <!-- Description -->
            <p class="font-epilogue text-base sm:text-lg md:text-xl text-vnGray font-normal leading-relaxed max-w-2xl mb-14 animate-fade-up delay-200">
                We are an Australian-led firm providing end-to-end handover snag inspection and contractor management for Dubai agents and property managers.
            </p>

            <!-- WhatsApp CTA -->
            <div class="animate-fade-up delay-300">
                <a 
                    href="https://wa.me/971585211269" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="inline-flex items-center justify-center gap-3 bg-vnBlack text-vnWhite font-urbanist text-sm sm:text-base font-semibold tracking-[0.12em] uppercase px-10 py-4 shadow-[0_14px_34px_rgba(0,0,0,0.12)] hover:bg-vnGray transition-colors duration-300"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.126.556 4.124 1.535 5.862l-1.535 5.603 5.736-1.505c1.696.906 3.631 1.422 5.69 1.422 6.627 0 12-5.373 12-12 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span>Let's chat</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="w-full py-8 px-6 md:px-12 text-center">
        <p class="font-epilogue text-xs text-vnGray tracking-wider">
            &copy; <span id="year"></span> Vantage North. Dubai, UAE.
        </p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
